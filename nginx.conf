server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Suporte a SPA (Single Page Application - Vue Router no modo HTML5 History)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca deve ser cacheado pelo navegador (garante que sempre busque os bundles JS/CSS atuais)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache longo e imutável exclusivamente para assets versionados com hash dentro de /assets/
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Demais assets estáticos fora de /assets/ (ex.: favicon, imagens)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
